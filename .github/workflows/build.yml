name: Build Blender Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r30
        run: |
          yes | sdkmanager --install "ndk;30.0.14909"

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-31 \
            -DWITH_CYCLES=ON \
            -DWITH_ALEMBIC=OFF -DWITH_MOD_FLUID=OFF -DWITH_BULLET=OFF \
            -DWITH_CODEC_FFMPEG=OFF -DWITH_IMAGE_OPENEXR=OFF -DWITH_AUDASPACE=OFF \
            -DWITH_COMPOSITOR=OFF

      - name: Build
        run: cmake --build build --target install

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blender-android-apk
          path: build/**/*.apk
