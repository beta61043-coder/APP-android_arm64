name: Build Blender Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      # 1. Ставим JDK 17 ТОЛЬКО для того, чтобы скачался Android SDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;21.4.7075529" "cmake;3.10.2.4988404"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV

      # 2. Переключаемся на JDK 11 для старого Gradle 6.5
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # 3. Устанавливаем Gradle 6.5 (кэш отключен, чтобы не было ошибки 400)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '6.5'
          cache-disabled: true

      # 4. Сборка
      - name: Build APK with Gradle
        working-directory: ./OBlender
        run: gradle assembleDebug --stacktrace

      # 5. Сохранение результата
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blender-android-apk
          path: OBlender/app/build/outputs/apk/debug/*.apk
